services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cad
      POSTGRES_PASSWORD: cad
      POSTGRES_DB: cad
    ports:
      - "5432:5432"
    volumes:
      - cad_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cad -d cad"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/apps --reload-dir /app/packages
    environment:
      CAD_DATABASE_URL: postgresql://cad:cad@postgres:5432/cad
      CAD_REDIS_URL: redis://redis:6379/0
      CAD_OBJECT_STORE_DIR: /object-storage
    volumes:
      - ..:/app
      - ../object-storage:/object-storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: watchfiles --filter python "python -m apps.worker.main" /app/apps /app/packages
    environment:
      CAD_DATABASE_URL: postgresql://cad:cad@postgres:5432/cad
      CAD_REDIS_URL: redis://redis:6379/0
      CAD_OBJECT_STORE_DIR: /object-storage
    volumes:
      - ..:/app
      - ../object-storage:/object-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tests:
    build:
      context: ..
      dockerfile: Dockerfile
    command: pytest -q
    environment:
      CAD_DATABASE_URL: postgresql://cad:cad@postgres:5432/cad
      CAD_REDIS_URL: redis://redis:6379/0
      CAD_OBJECT_STORE_DIR: /object-storage
      CAD_RUN_INTEGRATION: "1"
    volumes:
      - ..:/app
      - ../object-storage:/object-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  cad_pg_data:
