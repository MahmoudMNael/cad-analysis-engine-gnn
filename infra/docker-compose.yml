services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cad
      POSTGRES_PASSWORD: cad
      POSTGRES_DB: cad
    ports:
      - "5433:5432"
    volumes:
      - cad_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cad -d cad"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: 8000
      CAD_DATABASE_URL: postgresql://cad:cad@postgres:5432/cad
      CAD_REDIS_URL: redis://redis:6379/0
      CAD_OBJECT_STORE_DIR: /object-storage
      CAD_ODA_CONVERTER_PATH: /usr/local/bin/oda-headless.sh
      CAD_WORKER_COUNT: ${CAD_WORKER_COUNT:-2}
      CAD_FRONTEND_TRAINER_BASE_URL: ${CAD_FRONTEND_TRAINER_BASE_URL:-}
      CAD_SMTP_HOST: ${CAD_SMTP_HOST:-}
      CAD_SMTP_PORT: ${CAD_SMTP_PORT:-587}
      CAD_SMTP_USER: ${CAD_SMTP_USER:-}
      CAD_SMTP_PASSWORD: ${CAD_SMTP_PASSWORD:-}
      CAD_SMTP_FROM: ${CAD_SMTP_FROM:-}
      CAD_SMTP_USE_TLS: ${CAD_SMTP_USE_TLS:-true}
    volumes:
      - ..:/app
      - ../object-storage:/object-storage
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tests:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    command: pytest -q
    environment:
      CAD_DATABASE_URL: postgresql://cad:cad@postgres:5432/cad
      CAD_REDIS_URL: redis://redis:6379/0
      CAD_OBJECT_STORE_DIR: /object-storage
      CAD_ODA_CONVERTER_PATH: /usr/local/bin/oda-headless.sh
      CAD_RUN_INTEGRATION: "1"
    volumes:
      - ..:/app
      - ../object-storage:/object-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  cad_pg_data:
