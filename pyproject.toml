[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-analysis-engine-gnn"
version = "0.1.0"
description = "Hybrid CAD analysis platform: deterministic geometry with replaceable GNN blocks"
readme = "GNN CAD Analyzer Project Plan V2.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "shapely>=2.0.6",
  "ezdxf>=1.3.0",
  "networkx>=3.4.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.2.0",
  "pyarrow>=17.0.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4.0",
  "torch-geometric>=2.6.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-timeout>=2.3.0",
]

[project.scripts]
cad-api = "apps.api.main:run"
cad-worker = "apps.worker.main:main"
cad-migrate = "packages.store.db.migrate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs PostgreSQL, Redis, and object storage",
]
timeout = 120
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
